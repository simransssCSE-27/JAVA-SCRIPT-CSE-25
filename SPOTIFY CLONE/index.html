<!DOCTYPE html>
<html>
<head>
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="sidebar">
        <h2>Spotify</h2>

        <ul>
            <li>🏠 Home</li>
            <li>🔍 Search</li>
            <li>🎵 Library</li>
            <li>❤️ Liked Songs</li>
        </ul>
    </div>

    <div class="main">

        <input type="text" id="searchBox" placeholder="Search Songs">
        <button class="search-btn" onclick="searchSong()">Search</button>

        <h1>Trending Songs</h1>

        <div class="cards">

            <div class="card song">
                <img src="https://i.ytimg.com/vi/W0DM5lcj6mw/maxresdefault.jpg">
                <h3>Believer</h3>
                <p>Imagine Dragons</p>
            </div>

            <div class="card song">
                <img src="https://evolvecenter.rs/wp-content/uploads/2018/09/perfect.jpg">
                <h3>Perfect</h3>
                <p>Ed Sheeran</p>
            </div>

            <div class="card song">
                <img src="https://i.ytimg.com/vi/60ItHLz5WEA/maxresdefault.jpg">
                <h3>Faded</h3>
                <p>Alan Walker</p>
            </div>

            <div class="card song">
                <img src="https://i0.wp.com/yaleclimateconnections.org/wp-content/uploads/2022/08/0822_heat_tree_1600.jpg?fit=1200%2C675&ssl=1">
                <h3>Heat Waves</h3>
                <p>Glass Animals</p>
            </div>

            <div class="card song">
                <img src="https://i.ytimg.com/vi/o3noebwFgro/hq720.jpg?sqp=-oaymwE7CK4FEIIDSFryq4qpAy0IARUAAAAAGAElAADIQj0AgKJD8AEB-AH-CYAC0AWKAgwIABABGH8gOSgTMA8=&rs=AOn4CLAE5bdYUi-GTv-cGkapXufv7qW9HQ">
                <h3>Blinding Lights</h3>
                <p>The Weeknd</p>
            </div>

            <div class="card song">
                <img src="https://i.ytimg.com/vi/Vds8ddYXYZY/maxresdefault.jpg">
                <h3>Shape of You</h3>
                <p>Ed Sheeran</p>
            </div>

        </div>

    </div>

</div>

<div class="player">
    <button onclick="playSong()">▶ Play Music</button>
</div>

<script src="script.js"></script>

</body>
</html>
